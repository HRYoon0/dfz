<style id="dfz-shim">
  #dfz-frame { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: #202B3D; color: #F4F8FF;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; overflow: hidden; z-index: 10; }
  #dfz-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2vh; padding: 1.6vh 2.4vh; border-bottom: 1px solid rgba(255,255,255,.12); }
  #dfz-title { font-size: 5.6vh; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dfz-hint { font-size: 3.2vh; color: #CCDCE9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dfz-time { font-size: 6.4vh; font-weight: 700; color: #D1F58E; font-variant-numeric: tabular-nums; }
  #dfz-stage { position: relative; min-height: 0; overflow: hidden; }
  #dfz-chips { display: grid; gap: 1vh; padding: 1.2vh 2.4vh 1.6vh; border-top: 1px solid rgba(255,255,255,.12); }
  .dfz-chip { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: .6vh 1vh; padding: .8vh 1.2vh;
    border-radius: 1.2vh; background: #30435A; border: .35vh solid var(--c); }
  .dfz-chip .keys { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .6vh; }
  .dfz-chip b { font-size: 3.4vh; color: var(--c); }
  .dfz-chip .sc { font-size: 4vh; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .dfz-chip .st { font-size: 2.4vh; color: #CCDCE9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dfz-chip button { white-space: nowrap; font: 700 2.2vh 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; padding: .6vh 1vh; border-radius: .8vh; border: 0; background: #445A78; color: #F4F8FF; cursor: pointer; }
  .dfz-chip button:active { background: #5C7AA0; }
  #dfz-toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 2vh 4vh; border-radius: 2vh; background: rgba(20,30,44,.86);
    font-size: 7vh; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 6; white-space: nowrap; }
  #dfz-over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
    background: rgba(20,30,44,.88); z-index: 7; text-align: center; }
  #dfz-over h2 { margin: 0; font-size: 7vh; color: #D1F58E; }
  #dfz-over p { margin: 0; font-size: 3.2vh; color: #CCDCE9; line-height: 1.5; }
  #dfz-over .line { font-size: 5vh; font-weight: 700; }
  #dfz-over .pick { display: flex; gap: 1.2vh; }
  #dfz-over button { font: 700 3.6vh 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; padding: 1.2vh 2.6vh; border-radius: 1.4vh; border: .3vh solid #5C7AA0; background: #30435A; color: #F4F8FF; cursor: pointer; }
  #dfz-over button.on, #dfz-over button.go { background: #D1F58E; color: #202B3D; border-color: #D1F58E; }
  .dfz-spark { position: absolute; width: 1.4vh; height: 1.4vh; margin: -.7vh 0 0 -.7vh; border-radius: 50%; background: var(--c); animation: dfz-spark .6s ease-out forwards; }
  @keyframes dfz-spark { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
  .dfz-float-text { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 900 6vh/1 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: var(--c);
    text-shadow: 0 .3vh .9vh rgba(0,0,0,.45); animation: dfz-rise .9s ease-out forwards; }
  @keyframes dfz-rise { to { transform: translate(-50%, -150%); opacity: 0; } }
  .dfz-confetti { position: absolute; top: -3vh; width: 1.4vh; height: 2.2vh; border-radius: .3vh; animation: dfz-fall 2.6s ease-in forwards; }
  @keyframes dfz-fall { to { transform: translateY(110vh) rotate(var(--r)); } }
</style>
<script>
/* 단독 실행용 dfz 대역 — Digital Fit Zone 앱 없이 브라우저에서 바로 돌게 한다.
   앱의 웹 게임 통로(bridge: players)와 같은 이름의 기능만 직접 새로 짰다.
   build_standalone.py가 룰셋에서 읽은 window.DFZ_SHIM(시간·동작·인원)을 앞에 넣어 준다.
   조작: 동작마다 한 줄씩 1~6 / Q~Y / A~H / Z~N 키 (자리 순) · 스페이스 = 시작 */
(function () {
  'use strict';
  const OPT = window.DFZ_SHIM || {};
  const SECONDS = OPT.seconds || 60, COUNTDOWN = OPT.countdown || 3, MAXP = Math.min(6, OPT.maxPlayers || 6);
  const ACTIONS = OPT.actions || ['Jump', 'Squat'];
  const COLORS = ['#FF8A7A', '#8CC8FF', '#D1F58E', '#FFD66B', '#C7A4FF', '#A4F0D7'];
  const ROWS = ['123456', 'qwerty', 'asdfgh', 'zxcvbn'];
  const NAMES = { Jump: '점프', Squat: '앉기', Raise: '만세', Press: '누르기', Shake: '흔들기', Touch: '터치', Move: '손' };
  /* 키 한 줄 = 조작 하나. 기울이기는 왼쪽·오른쪽 두 줄을 쓴다 */
  const CTRLS = [];
  const HAS_RELEASE = ACTIONS.indexOf('Release') >= 0;   /* 누르기를 떼면 Release를 보낸다 */
  ACTIONS.forEach(function (a) {
    if (a === 'Move' || a === 'Release') return;   /* Move는 마우스가 맡는다 */
    if (a === 'Tilt') { CTRLS.push({ action: a, x: -1, name: '◀' }, { action: a, x: 1, name: '▶' }); }
    else CTRLS.push({ action: a, x: 0, name: NAMES[a] || a });
  });
  CTRLS.splice(ROWS.length);
  CTRLS.forEach(function (c, k) { c.keys = ROWS[k]; c.repeat = c.action === 'Tilt'; });
  const H = { ready: [], players: [], join: [], leave: [], input: [], start: [], end: [] };
  let cfg = null, list = [], started = false, ended = false, startAt = 0, count = 4;
  const scores = {}, chips = {};
  let UI = null, title = '', hint = '';

  function call(fn, a) { try { fn(a); } catch (err) { console.error(err); } }
  function emit(t, a) { (H[t] || []).forEach(function (fn) { call(fn, a); }); }
  function el(tag, cls, parent, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  function build() {
    if (UI) return UI;
    const root = el('div', '', document.body); root.id = 'dfz-frame';
    const top = el('div', '', root); top.id = 'dfz-top';
    const words = el('div', '', top);
    const t = el('div', '', words); t.id = 'dfz-title';
    const h = el('div', '', words); h.id = 'dfz-hint';
    const time = el('div', '', top); time.id = 'dfz-time';
    const stage = el('div', '', root); stage.id = 'dfz-stage'; stage.setAttribute('data-dfz-stage', '1');
    const box = el('div', '', root); box.id = 'dfz-chips';
    const toast = el('div', '', stage); toast.id = 'dfz-toast';
    UI = { title: t, hint: h, time: time, stage: stage, chips: box, toast: toast, over: null, toastTimer: 0 };
    t.textContent = title || document.title; h.textContent = hint;
    setInterval(tickTime, 250); tickTime();
    return UI;
  }
  function tickTime() {
    if (!UI) return;
    if (ended) { UI.time.textContent = '끝'; return; }
    if (!started) { UI.time.textContent = '준비'; return; }
    const left = Math.max(0, Math.ceil(SECONDS - (performance.now() - startAt) / 1000));
    UI.time.textContent = left + '초';
    if (left <= 0) finish();
  }
  function drawChips() {
    const box = build().chips;
    box.innerHTML = '';
    box.style.gridTemplateColumns = 'repeat(' + Math.max(1, list.length) + ', minmax(0, 1fr))';
    list.forEach(function (p, i) {
      const c = el('div', 'dfz-chip', box); c.style.setProperty('--c', p.color);
      el('b', '', c, p.seat + '번');
      const sc = el('div', 'sc', c, String(scores[p.seat] || 0));
      const keys = el('div', 'keys', c);   /* 단추는 아랫줄 — 칸이 좁으면 줄을 바꾼다 */
      CTRLS.forEach(function (k) {
        const b = el('button', '', keys, k.name + ' ' + k.keys[i].toUpperCase());
        if (k.action === 'Press' && HAS_RELEASE) {
          b.onmousedown = function () { input(i, k); };
          b.onmouseup = b.onmouseleave = function () { input(i, { action: 'Release', x: 0 }); };
        } else b.onclick = function () { input(i, k); };
      });
      const st = el('div', 'st', c); st.style.gridColumn = '1 / -1';
      chips[p.seat] = { sc: sc, st: st };
    });
  }

  function seatOf(s) {
    if (typeof s === 'number') return list[s] ? list[s].seat : null;
    return list.some(function (p) { return p.seat === s; }) ? s : null;
  }

  function stagePoint(x, y) {
    if (x && x.getBoundingClientRect) {
      const r = x.getBoundingClientRect(), s = build().stage.getBoundingClientRect();
      return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
    }
    return { x: Number(x) || 0, y: Number(y) || 0 };
  }

  const kit = {
    version: 1,
    fx: function (e) { return e; },
    burst: function (x, y, color, text) {
      if (x && x.getBoundingClientRect) { text = color; color = y; }
      const at = stagePoint(x, y);
      const box = el('div', '', build().stage);
      box.style.cssText = 'position:absolute;left:' + at.x + 'px;top:' + at.y + 'px;width:0;height:0;pointer-events:none;z-index:5';
      box.style.setProperty('--c', color || '#D1F58E');
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * 6.2832, d = 5 + Math.random() * 9, s = el('i', 'dfz-spark', box);
        s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(2) + 'vh');
        s.style.setProperty('--dy', (Math.sin(a) * d).toFixed(2) + 'vh');
      }
      if (text != null && text !== '') el('b', 'dfz-float-text', box, String(text));
      setTimeout(function () { box.remove(); }, 1000);
      return box;
    },
    confetti: function (n) {
      n = Math.max(10, Math.min(120, Math.round(Number(n) || 60)));
      const cs = ['#D1F58E', '#A4F0D7', '#FFD66B', '#FF8A7A', '#8CC8FF', '#C7A4FF'];
      const box = el('div', '', build().stage);
      box.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8';
      for (let i = 0; i < n; i++) {
        const p = el('i', 'dfz-confetti', box);
        p.style.left = (Math.random() * 100).toFixed(1) + '%';
        p.style.background = cs[i % cs.length];
        p.style.animationDelay = (Math.random() * 0.6).toFixed(2) + 's';
        p.style.setProperty('--r', Math.round(Math.random() * 720 - 360) + 'deg');
      }
      setTimeout(function () { box.remove(); }, 3400);
      return box;
    },
    cols: function (n) { return Math.max(1, Math.ceil(Math.sqrt(Number(n) || 1))); }
  };

  const api = {
    on: function (t, fn) {
      if (!H[t] || typeof fn !== 'function') return api;
      H[t].push(fn);
      if (t === 'ready' && cfg) call(fn, cfg);
      if (t === 'players' && cfg) call(fn, list.slice());
      return api;
    },
    score: function (s, points) {
      const seat = seatOf(s), n = Math.round(Number(points));
      if (!seat || !isFinite(n)) return;
      scores[seat] = n;
      if (chips[seat]) chips[seat].sc.textContent = String(n);
    },
    finish: function () { finish(); },
    get config() { return cfg; },
    get players() { return list.slice(); },
    get started() { return started; },
    get ended() { return ended; },
    kit: kit,
    ui: {
      frame: function (o) {
        o = o || {};
        if (o.title) title = String(o.title);
        if (o.hint) hint = String(o.hint);
        build(); UI.title.textContent = title || document.title; UI.hint.textContent = hint;
        return UI.stage;
      },
      get stage() { return build().stage; },
      hint: function (t) { hint = String(t || ''); if (UI) UI.hint.textContent = hint; },
      toast: function (t, color) {
        const x = build().toast;
        x.textContent = String(t || ''); x.style.color = color || '#F4F8FF'; x.style.opacity = '1';
        clearTimeout(UI.toastTimer);
        UI.toastTimer = setTimeout(function () { x.style.opacity = '0'; }, 1100);
      },
      status: function (seat, t) { const s = seatOf(seat); if (s && chips[s]) chips[s].st.textContent = String(t || ''); },
      canvas: function () {
        const st = build().stage;
        let c = st.querySelector('canvas[data-dfz]');
        if (c) return c;
        c = document.createElement('canvas');
        c.setAttribute('data-dfz', '1');
        c.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
        st.insertBefore(c, st.firstChild);
        function fit() { const r = st.getBoundingClientRect(); c.width = Math.max(1, Math.round(r.width)); c.height = Math.max(1, Math.round(r.height)); }
        fit(); window.addEventListener('resize', fit);
        return c;
      }
    }
  };
  Object.defineProperty(window, 'dfz', { value: Object.freeze(api), writable: false, configurable: false });

  /* ---------- 앱 대신 판을 돌리는 쪽 ---------- */

  function setPlayers(n) {
    count = n;
    const old = {};
    list.forEach(function (p) { old[p.seat] = p; });
    list = [];
    for (let i = 0; i < n; i++) list.push({ seat: String(i + 1), index: i, color: COLORS[i], team: 0 });
    emit('players', list.slice());
    list.forEach(function (p) { if (!old[p.seat]) emit('join', p); });
    Object.keys(old).forEach(function (s) { if (!list.some(function (p) { return p.seat === s; })) emit('leave', old[s]); });
    drawChips();
  }

  function input(i, ctrl, y) {
    const p = list[i];
    if (!p || !started || ended) return;
    emit('input', { seat: p.seat, index: p.index, action: ctrl.action, x: ctrl.x, y: y || 0, strength: 1 });
  }
  /* 마우스 = 1번 자리의 포인터 장치 (룰셋에 Move가 있을 때) — 판 위 위치를 0~1로 */
  if (ACTIONS.indexOf('Move') >= 0) {
    const at = function (e) { const r = build().stage.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
    window.addEventListener('mousemove', function (e) { const v = at(e); input(0, { action: 'Move', x: v[0] }, v[1]); });
    window.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('#dfz-stage') && !e.target.closest('#dfz-over')) input(0, { action: 'Press', x: 0 }); });
    window.addEventListener('mouseup', function (e) { if (HAS_RELEASE && e.target.closest && e.target.closest('#dfz-stage')) input(0, { action: 'Release', x: 0 }); });
  }

  function overlay() {
    const st = build().stage;
    if (UI.over) UI.over.remove();
    UI.over = el('div', '', st); UI.over.id = 'dfz-over';
    return UI.over;
  }

  function showSetup() {
    const o = overlay();
    el('h2', '', o, title || document.title);
    el('p', '', o, '몇 명이 할까요?');
    const pick = el('div', 'pick', o);
    for (let n = 1; n <= MAXP; n++) {
      const b = el('button', n === count ? 'on' : '', pick, n + '명');
      b.onclick = function () { setPlayers(n); showSetup(); };
    }
    el('p', '', o, CTRLS.map(function (k) { return k.name + ': ' + k.keys[0].toUpperCase() + '~' + k.keys[5].toUpperCase(); }).join(' · ')
      + ' · 화면 아래 단추로도 할 수 있어요');
    const go = el('button', 'go', o, '시작 (스페이스)');
    go.onclick = countdown;
  }

  let counting = false;
  function countdown() {
    if (started || counting) return;
    counting = true;
    let n = COUNTDOWN;
    const o = overlay();
    const big = el('h2', '', o, String(n));
    big.style.fontSize = '20vh';
    const timer = setInterval(function () {
      n--;
      if (n > 0) { big.textContent = String(n); return; }
      clearInterval(timer);
      o.remove(); UI.over = null;
      started = true; startAt = performance.now();
      emit('start');
    }, 1000);
  }

  function finish() {
    if (!started || ended) return;
    ended = true;
    emit('end');
    const o = overlay();
    el('h2', '', o, '결과');
    list.slice().sort(function (a, b) { return (scores[b.seat] || 0) - (scores[a.seat] || 0); }).slice(0, 5).forEach(function (p, k) {
      const line = el('div', 'line', o, (k + 1) + '등  ' + p.seat + '번  ' + (scores[p.seat] || 0) + '점');
      line.style.color = p.color;
    });
    const again = el('button', 'go', o, '다시 하기');
    again.onclick = function () { location.reload(); };
  }

  window.addEventListener('keydown', function (ev) {
    const k = ev.key.toLowerCase();
    if (k === ' ') { ev.preventDefault(); if (!started) countdown(); return; }
    CTRLS.forEach(function (c) {
      const i = c.keys.indexOf(k);
      if (i >= 0 && (c.repeat || !ev.repeat)) input(i, c);
    });
  });
  window.addEventListener('keyup', function (ev) {
    if (!HAS_RELEASE) return;
    const k = ev.key.toLowerCase();
    CTRLS.forEach(function (c) { const i = c.keys.indexOf(k); if (i >= 0 && c.action === 'Press') input(i, { action: 'Release', x: 0 }); });
  });

  window.addEventListener('DOMContentLoaded', function () {
    build();
    cfg = Object.freeze({ seconds: SECONDS, minPlayers: 1, maxPlayers: OPT.maxPlayers || 6, mode: 'individual', teams: 0, actions: ACTIONS.slice(), lang: 'ko' });
    emit('ready', cfg);
    setPlayers(count);
    showSetup();
  });
})();
</script>

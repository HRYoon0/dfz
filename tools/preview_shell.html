<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>웹 게임 미리보기</title>
<style>
  :root { --bg: #11172A; --panel: #1B2440; --ink: #F4F8FF; --muted: #A9B8D0; --lime: #D1F58E; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
  #stage { position: relative; background: #000; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
  h1 { font-size: 17px; margin: 0; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button, select, input { font: inherit; color: var(--ink); background: #2A365C; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button:hover { background: #34436F; cursor: pointer; }
  button.primary { background: var(--lime); color: #11172A; font-weight: 700; }
  .seat { display: grid; grid-template-columns: 22px 1fr repeat(4, auto); gap: 6px; align-items: center; }
  .dot { width: 18px; height: 18px; border-radius: 50%; }
  .muted { color: var(--muted); font-size: 12px; line-height: 1.5; }
  #log { font: 12px/1.45 Consolas, monospace; background: #0E1426; border-radius: 8px; padding: 8px; height: 220px; overflow: auto; white-space: pre-wrap; }
  #phase { font-weight: 700; color: var(--lime); }
</style></head>
<body>
<div id="stage"><iframe id="g" sandbox="allow-scripts"></iframe></div>
<aside>
  <h1>웹 게임 미리보기</h1>
  <div class="muted">앱이 쓰는 dfz 통로·도구를 그대로 붙인 화면입니다. 카메라 대신 단추·키보드로 가짜 참가자를 움직입니다.</div>
  <div class="row">
    <label>인원 <select id="count"></select></label>
    <label>시간 <input id="secs" type="number" min="10" max="600" value="60" style="width:70px">초</label>
  </div>
  <div class="row">
    <button class="primary" id="start">시작</button>
    <button id="end">끝내기</button>
    <button id="reload">처음부터</button>
  </div>
  <div class="row"><label><input type="checkbox" id="bots"> 자동 참가자(룰셋 동작을 무작위로)</label></div>
  <div>상태: <span id="phase">준비</span></div>
  <div id="seats"></div>
  <div id="log"></div>
</aside>
<script>
(function () {
  const GAME = /*__GAME_SRCDOC__*/null;
  const OPT = /*__OPTS__*/{};   /* build_preview.py가 룰셋에서 읽어 넣는다: seconds, actions, maxPlayers */
  const ACTIONS = OPT.actions || ['Jump', 'Squat'];
  const NAMES = { Jump: '점프', Squat: '앉기', Raise: '만세', Press: '누르기', Release: '떼기', Shake: '흔들기', Touch: '터치' };
  const CTRLS = [];
  ACTIONS.forEach(function (a) {
    if (a === 'Move') return;
    if (a === 'Tilt') CTRLS.push({ action: a, x: -1, name: '◀' }, { action: a, x: 1, name: '▶' });
    else CTRLS.push({ action: a, x: 0, name: NAMES[a] || a });
  });
  const COLORS = ['#FF8A7A', '#8CC8FF', '#D1F58E', '#FFD66B', '#C7A4FF', '#A4F0D7'];
  const SQUAT_KEYS = ['q', 'w', 'e', 'r', 't', 'y'];
  const f = document.getElementById('g');
  const $ = function (id) { return document.getElementById(id); };
  let players = [], started = false, ended = false, endTimer = 0, botTimer = 0, startAt = 0;

  $('secs').value = OPT.seconds || 60;
  for (let i = 1; i <= (OPT.maxPlayers || 6); i++) $('count').add(new Option(i + '명', i, i === 4, i === 4));

  function log(s) {
    const box = $('log');
    const t = started ? ((performance.now() - startAt) / 1000).toFixed(1) + 's ' : '';
    box.textContent += t + s + '\n';
    box.scrollTop = box.scrollHeight;
  }
  function post(e, d) { if (f.contentWindow) f.contentWindow.postMessage({ t: 'dfz', e: e, d: d }, '*'); }

  function config() {
    return { seconds: Number($('secs').value) || 60, minPlayers: 1, maxPlayers: OPT.maxPlayers || 6, mode: 'individual', teams: 0, actions: ACTIONS, lang: 'ko' };
  }
  function makePlayers() {
    const n = Number($('count').value);
    players = [];
    for (let i = 0; i < n; i++) players.push({ seat: String(i + 1), index: i, color: COLORS[i % COLORS.length], team: 0 });
    const box = $('seats');
    box.innerHTML = '';
    players.forEach(function (p, i) {
      const row = document.createElement('div');
      row.className = 'seat';
      row.innerHTML = '<span class="dot" style="background:' + p.color + '"></span><span>' + p.seat + '번 · 점수 <b id="sc' + p.seat + '">0</b></span>';
      CTRLS.forEach(function (c) {
        const b = document.createElement('button'); b.textContent = c.name; b.onclick = function () { input(i, c.action, c.x); };
        row.appendChild(b);
      });
      box.appendChild(row);
    });
  }
  function input(i, action, x, y) {
    const p = players[i];
    if (!p) return;
    post('inputs', [{ seat: p.seat, index: p.index, action: action, x: x || 0, y: y || 0, strength: 1 }]);
  }

  function load() {
    started = false; ended = false;
    clearTimeout(endTimer);
    $('phase').textContent = '준비';
    $('log').textContent = '';
    makePlayers();
    f.srcdoc = GAME;
  }
  f.addEventListener('load', function () {
    post('config', config());
    post('players', players);
  });

  $('start').onclick = function () {
    if (started) return;
    started = true; startAt = performance.now();
    $('phase').textContent = '진행 중';
    post('start');
    endTimer = setTimeout(finish, config().seconds * 1000);
    log('시작');
  };
  function finish() {
    if (!started || ended) return;
    ended = true;
    $('phase').textContent = '끝';
    post('end');
    log('끝');
  }
  $('end').onclick = finish;
  $('reload').onclick = load;
  $('count').onchange = load;

  $('bots').onchange = function () {
    clearInterval(botTimer);
    if (!this.checked) return;
    botTimer = setInterval(function () {
      players.forEach(function (p, i) {
        if (Math.random() < 0.35) { const c = CTRLS[Math.floor(Math.random() * CTRLS.length)]; input(i, c.action, c.x, c.action === 'Tilt' ? Math.random() * 2 - 1 : 0); }
      });
    }, 300);
  };

  window.addEventListener('keydown', function (ev) {
    const k = ev.key.toLowerCase();
    if (k >= '1' && k <= '6') input(Number(k) - 1, 'Jump');
    const s = SQUAT_KEYS.indexOf(k);
    if (s >= 0) input(s, 'Squat');
  });

  window.addEventListener('message', function (ev) {
    if (ev.source !== f.contentWindow) return;
    const d = ev.data;
    if (!d || d.t !== 'report') return;
    if (d.k === 'score') {
      const parts = String(d.v).split(':');
      const el = $('sc' + parts[0]);
      if (el) el.textContent = parts[1];
      log('점수 ' + parts[0] + '번 → ' + parts[1]);
    } else if (d.k === 'bridge') {
      /* 통로가 뜬 신호 — 앱은 이때 config를 다시 보낸다 */
    } else {
      log(d.k + ': ' + d.v);
    }
  });

  load();
})();
</script>
</body></html>
